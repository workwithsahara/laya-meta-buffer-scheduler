name: One-off account check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: node check-account.js
