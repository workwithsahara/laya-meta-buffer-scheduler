name: Test audio video (renders the next day or two)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-one:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Make sure ffmpeg is installed
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Render the upcoming quote videos
        env:
          AUDIO_VIDEO: "on"
          MEDIA_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          LAYA_ROOT_FOLDER_ID: ${{ secrets.LAYA_ROOT_FOLDER_ID }}
          RENDER_DAYS: "1"
        run: node render-upcoming.js
